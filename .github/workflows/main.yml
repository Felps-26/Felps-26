name: Generate Pac-Man

on:
  schedule:
    - cron: '0 0 * * *' # Executa diariamente à meia-noite
  workflow_dispatch: # Permite execução manual
  push:
    branches:
    - main

jobs:
  generate:
    runs-on: ubuntu-latest
    
    steps:
    - name: Generate Pac-Man Contribution Graph
      uses: abozanona/pacman-contribution-graph@v1
      with:
        github_user_name: 'Felps-26'
        include_private: false
        svg_out_path: 'pacman.svg'
        push_to_branch: 'output'
        commit_message: 'Update pacman contribution graph'
        githubtoken: ${{ secrets.GITHUB_TOKEN }}
