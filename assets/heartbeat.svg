<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 60" width="900" height="60" role="img" aria-label="">
  <defs>
    <style>
      .line { stroke-dasharray: 260 1240; animation: run 3.2s linear infinite; }
      @keyframes run { from { stroke-dashoffset: 260; } to { stroke-dashoffset: -1240; } }
    </style>
  </defs>
  <!-- faint base line -->
  <path d="M0 30 H330 L350 30 L362 8 L378 52 L392 18 L402 30 H900"
        fill="none" stroke="#FF2A6D" stroke-opacity="0.18" stroke-width="2"/>
  <!-- travelling pulse -->
  <path class="line" d="M0 30 H330 L350 30 L362 8 L378 52 L392 18 L402 30 H900"
        fill="none" stroke="#00F0FF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
